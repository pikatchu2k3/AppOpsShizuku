[versions]
agp = "8.7.3"
kotlin = "2.0.21"
shizuku = "13.1.5"
material = "1.12.0"
appcompat = "1.7.0"
coreKtx = "1.13.1"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
apksig = "8.7.3"
bouncycastle = "1.78.1"
smali = "2.5.2"
junit = "4.13.2"
orgJson = "20240303"

[libraries]
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
material = { module = "com.google.android.material:material", version.ref = "material" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
smali = { module = "org.smali:smali", version.ref = "smali" }
smali-baksmali = { module = "org.smali:baksmali", version.ref = "smali" }
smali-dexlib2 = { module = "org.smali:dexlib2", version.ref = "smali" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
